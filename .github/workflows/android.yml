name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ v3_openjdk ]
  pull_request:
    branches: [ v3_openjdk ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 8 (Required for jre_lwjgl3glfw)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Set up Java 17 (Default build JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Get LTW
        run: |
          mkdir -p app_pojavlauncher/libs
          cd app_pojavlauncher/libs
          wget -q https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar
