name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ v3_openjdk ]
  pull_request:
    branches: [ v3_openjdk ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Get LTW
        run: |
          mkdir -p app_pojavlauncher/libs
          cd app_pojavlauncher/libs
          wget -q https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK without runtime
        run: |
          mkdir -p out
          ./gradlew assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/*.apk out/NinjaLauncher-debug.apk

      - name: Upload Ninja Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: NinjaLauncher-APK
          path: out/NinjaLauncher-debug.apk
